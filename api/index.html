<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solvex — Génie IA</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #090d16; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    header { background: #111827; padding: 16px; text-align: center; font-weight: bold; font-size: 1.3rem; border-bottom: 1px solid #38bdf8; color: #38bdf8; letter-spacing: 1px; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: auto; box-sizing: border-box; }
    .msg { padding: 12px 16px; border-radius: 14px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
    .user { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: #1e293b; align-self: flex-start; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .rage { background: #450a0a; border: 1px solid #ef4444; color: #fecaca; }
    form { display: flex; gap: 10px; padding: 15px; background: #111827; max-width: 800px; width: 100%; margin: auto; box-sizing: border-box; }
    input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #334155; background: #090d16; color: white; font-size: 1rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 22px; border-radius: 10px; border: none; background: #38bdf8; color: #090d16; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>⚡ SOLVEX AI — Génie Artificiel</header>
  <div id="chat">
    <div class="msg bot">Salut ! Je suis Solvex, ton génie personnel. Pose-moi n'importe quel défi (et reste poli, sinon ça va chauffer).</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Parle à Solvex..." required autocomplete="off" />
    <button type="submit">Envoyer</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    let history = [];

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      if (text.includes("RAGE")) div.classList.add("rage");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMsg(text, "user");
      history.push({ role: "user", content: text });
      const loading = addMsg("Solvex analyse...", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history })
        });
        const data = await res.json();
        const reply = data.reply || "Erreur de réponse.";
        loading.textContent = reply;
        if (reply.includes("RAGE")) loading.classList.add("rage");
        history.push({ role: "assistant", content: reply });
      } catch {
        loading.textContent = "Impossible de joindre le cerveau de Solvex.";
      }
    });
  </script>
</body>
</html>
